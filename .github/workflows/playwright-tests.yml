name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPRINT: sprint5
      DISABLE_LOGGING: "true"

    steps:
      # ---------- 1. Get both repositories ----------
      - name: Check out framework
        uses: actions/checkout@v4

      - name: Check out Toolshop application
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop

      # ---------- 2. Start the application ----------
      - name: Start Toolshop containers
        working-directory: toolshop
        run: docker compose -f docker-compose.yml up -d

      - name: Install API dependencies
        working-directory: toolshop
        run: |
          sleep 30
          docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi

      - name: Wait for database
        working-directory: toolshop
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent; then
              echo "Database is ready"; exit 0
            fi
            echo "Waiting for database ($i/30)..."; sleep 2
          done
          echo "Database did not start"; exit 1

      - name: Create and seed database
        working-directory: toolshop
        run: docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Wait for UI
        working-directory: toolshop
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 | grep -q "200"; then
              echo "UI is ready"; exit 0
            fi
            echo "Waiting for UI ($i/60)..."; sleep 5
          done
          docker compose logs angular-ui
          echo "UI did not start"; exit 1

      # ---------- 3. Run the tests ----------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Playwright browser and system dependencies
        run: mvn -B exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: Run tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: mvn -B clean test -Dheadless=true -Dbrowser=chromium -Durl=http://localhost:4200/

      # ---------- 4. Reports ----------
      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

      - name: Show application logs on failure
        if: failure()
        working-directory: toolshop
        run: docker compose logs --tail=100